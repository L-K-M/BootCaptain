name: Feature request
description: Propose a collector, diagnostic, or user-facing improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not addressed today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public contract or evidence
      description: Link primary sources and identify any private/version-sensitive assumptions.
  - type: dropdown
    id: privilege
    attributes:
      label: Does this require privilege or mutation?
      options:
        - No; read-only and unprivileged
        - Read-only but permission-sensitive
        - Privileged read
        - Mutation or helper change
        - Unknown
    validations:
      required: true
