name: Bug report
description: Report reproducible incorrect behavior using sanitized information only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach raw BTM stores, unified logs, crash reports, crontabs,
        launchd databases, exported scans, usernames, paths, or command lines.
        Report security issues through the private advisory link instead.
  - type: input
    id: version
    attributes:
      label: BootCaptain version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and build
      placeholder: macOS 15.6 (24G84)
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Apple silicon
        - Intel
        - Virtual machine
        - Unknown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paraphrase or sanitize any host-specific evidence.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Coverage gaps shown by BootCaptain
      description: List collector names and statuses only; omit raw evidence.
  - type: checkboxes
    id: sanitization
    attributes:
      label: Data safety
      options:
        - label: I removed usernames, paths, commands, tokens, organization details, logs, and other host-specific data.
          required: true
