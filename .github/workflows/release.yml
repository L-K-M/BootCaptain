# Signed-only Developer ID release. BootCaptain's helper authentication requires
# an Apple-anchored app/helper pair with the same Team ID, so there is no ad-hoc
# publication fallback.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Re-prove the tagged commit
    uses: ./.github/workflows/ci.yml

  release:
    name: Sign, notarize, and publish
    needs: ci
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    env:
      APP_NAME: BootCaptain
      KEYCHAIN_PROFILE: bootcaptain-notary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require complete signing configuration
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            AC_API_KEY_BASE64 \
            AC_API_KEY_ID \
            AC_API_ISSUER_ID; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::BootCaptain publishes signed releases only; missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.3"

      - name: Install tooling
        run: |
          brew install xcodegen create-dmg
          python3 -m pip install --disable-pip-version-check -r requirements-icons.txt

      - name: Match tag to all committed versions
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/p' project.yml | head -n 1)"
          SWIFT="$(sed -nE 's/.*version = "([^"]+)".*/\1/p' Sources/BootCaptainCore/Info.swift | head -n 1)"
          [[ "$VERSION" == "$PROJECT" ]] || { echo "::error::tag $VERSION != project.yml $PROJECT"; exit 1; }
          [[ "$VERSION" == "$SWIFT" ]] || { echo "::error::tag $VERSION != BootCaptainCoreInfo $SWIFT"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        run: scripts/generate-project.sh

      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/bootcaptain-signing.keychain-db"
          P12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$P12"' EXIT
          if ! printf '%s' "$DEVELOPER_ID_P12_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$P12" 2>/dev/null \
             || [[ ! -s "$P12" ]]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not valid base64"
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$DEVELOPER_ID_P12_PASSWORD" -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')"
          [[ -n "$IDENTITY" ]] || { echo "::error::Developer ID Application identity not found"; exit 1; }
          echo "::add-mask::$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY"' EXIT
          if ! printf '%s' "$AC_API_KEY_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEY" 2>/dev/null \
             || [[ ! -s "$KEY" ]]; then
            echo "::error::AC_API_KEY_BASE64 is not valid base64"
            exit 1
          fi
          xcrun notarytool store-credentials "$KEYCHAIN_PROFILE" \
            --key "$KEY" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID"

      - name: Build and sign inside-out
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project BootCaptain.xcodeproj \
            -scheme BootCaptain \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          scripts/sign-app.sh "$APP" "$SIGN_IDENTITY"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify app/helper identities and requirements
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          HELPER="$APP_PATH/Contents/MacOS/ch.lkmc.bootcaptain.helper"
          APP_ID="$(codesign --display --verbose=4 "$APP_PATH" 2>&1 | sed -n 's/^Identifier=//p')"
          HELPER_ID="$(codesign --display --verbose=4 "$HELPER" 2>&1 | sed -n 's/^Identifier=//p')"
          [[ "$APP_ID" == "ch.lkmc.bootcaptain" ]] || { echo "::error::unexpected app ID: $APP_ID"; exit 1; }
          [[ "$HELPER_ID" == "ch.lkmc.bootcaptain.helper" ]] || { echo "::error::unexpected helper ID: $HELPER_ID"; exit 1; }
          APP_TEAM="$(codesign --display --verbose=4 "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          HELPER_TEAM="$(codesign --display --verbose=4 "$HELPER" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [[ "$APP_TEAM" == "$APPLE_TEAM_ID" ]] || { echo "::error::unexpected app Team ID: $APP_TEAM"; exit 1; }
          [[ "$HELPER_TEAM" == "$APPLE_TEAM_ID" ]] || { echo "::error::unexpected helper Team ID: $HELPER_TEAM"; exit 1; }
          APP_REQUIREMENT="$(codesign --display --requirements :- "$APP_PATH" 2>&1)"
          HELPER_REQUIREMENT="$(codesign --display --requirements :- "$HELPER" 2>&1)"
          [[ "$APP_REQUIREMENT" == *'identifier "ch.lkmc.bootcaptain"'* ]] || { echo "::error::unexpected app designated requirement"; exit 1; }
          [[ "$HELPER_REQUIREMENT" == *'identifier "ch.lkmc.bootcaptain.helper"'* ]] || { echo "::error::unexpected helper designated requirement"; exit 1; }
          codesign --verify --strict --verbose=2 "$HELPER"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          NOTARY_ZIP="$RUNNER_TEMP/$APP_NAME-notary.zip"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" --keychain-profile "$KEYCHAIN_PROFILE" --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose=4 "$APP_PATH"

      - name: Package, notarize, staple, and checksum
        id: package
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/dist"
          mkdir -p "$DIST"
          DMG="$DIST/$APP_NAME-$VERSION.dmg"
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 390 185 \
            "$DMG" "$APP_PATH" || true
          [[ -f "$DMG" ]] || { echo "::error::DMG was not created"; exit 1; }
          xcrun notarytool submit "$DMG" --keychain-profile "$KEYCHAIN_PROFILE" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          ZIP="$DIST/$APP_NAME-$VERSION.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          ( cd "$DIST" && shasum -a 256 ./*.dmg ./*.zip > "$APP_NAME-$VERSION.sha256" )
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: BootCaptain ${{ steps.version.outputs.version }}
          prerelease: true
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.dist }}/*.dmg
            ${{ steps.package.outputs.dist }}/*.zip
            ${{ steps.package.outputs.dist }}/*.sha256

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
