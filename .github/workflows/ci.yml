name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  linux-core:
    name: Build & test portable core (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: swift run bootcaptain coverage

  macos-app:
    name: Generate + build app (macOS, best-effort)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      # Project generation is the part this job actually verifies; it must pass.
      - name: Generate Xcode project
        run: xcodegen generate
      # The app/helper build needs a signing team + real macOS APIs; it is a
      # best-effort smoke build (unsigned) that never gates the PR.
      - name: Build app + helper (unsigned, best-effort)
        continue-on-error: true
        run: |
          xcodebuild build \
            -project BootCaptain.xcodeproj \
            -scheme BootCaptain \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
