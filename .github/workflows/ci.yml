# CI proves both products: the portable Swift package/CLI and the generated
# macOS app bundle containing the privileged helper. The latter is mandatory;
# a green run must never hide an app/helper compiler failure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate JSON and YAML
        run: |
          jq empty .claude/settings.json .markdownlint.json App/Assets.xcassets/AppIcon.appiconset/Contents.json
          npx --yes yaml-lint .github/workflows/*.yml .github/dependabot.yml .github/ISSUE_TEMPLATE/*.yml project.yml

      - name: Lint Markdown
        run: npx --yes markdownlint-cli --config .markdownlint.json -- '*.md'

      - name: Check whitespace
        run: git diff --check

  linux-core:
    name: Portable package and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: CLI smoke test
        run: swift run bootcaptain coverage

  macos-app:
    name: macOS app and helper
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.3"

      - name: Install tooling
        run: |
          brew install xcodegen
          # Homebrew's python is externally managed (PEP 668), so install
          # Pillow into a venv and put it first on PATH for later steps —
          # generate-project.sh calls a bare `python3`.
          python3 -m venv "$RUNNER_TEMP/icons-venv"
          "$RUNNER_TEMP/icons-venv/bin/pip" install --disable-pip-version-check -r requirements-icons.txt
          echo "$RUNNER_TEMP/icons-venv/bin" >> "$GITHUB_PATH"

      - name: Verify package, app, helper, and bundle
        run: scripts/verify.sh

      - name: Upload the assembled app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: BootCaptain-app-${{ github.sha }}
          path: build/DerivedData/Build/Products/Debug/BootCaptain.app
          if-no-files-found: error
          retention-days: 14
